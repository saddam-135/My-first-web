<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saddam Hussain | Personal Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            min-height: 100vh;
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(#0009, #000),
                        url("banner.jpg") center/cover;
        }

        .profile {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            color: #ccc;
            font-size: 18px;
        }

        nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #151515;
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 10;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        section {
            padding: 70px 20px;
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 30px;
        }

        .links a {
            display: block;
            background: #1c1c1c;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <header id="home">
        <img src="profile.jpg" class="profile">

        <h1>Saddam Hussain</h1>

        <p>Student | Quran Teacher | Islamic Studies</p>
    </header>

    <section id="about">
        <h2>About Me</h2>

        <p>
            Welcome to my personal website.
            Here you can find information about me,
            my studies, skills and interests.
        </p>
    </section>

    <section id="contact">
        <h2>Contact</h2>

        <div class="links">
            <a href="https://wa.me/923204177641">WhatsApp</a>
            <a href="https://facebook.com/">Facebook</a>
            <a href="mailto:youremail@example.com">Email</a>
        </div>
    </section>

    <footer>
        © 2026 Saddam Hussain
    </footer>

</body>
</html>
